<div class="w-100 h-100 register-background" [attr.data-bg]="randomBgNumber">
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="form w-auto rounded-5 bg-white p-4">
            <h2 class="text-center mb-3 mt-3">Verifica tu Cuenta</h2>
            <h4 class="textGrey mb-3">Introduce el código que se ha enviado al correo electrónico </h4>
            <div class="w-100 h-100">
                <div *ngIf="showError" class="alert alert-danger text-center mt-4 mb-4" role="alert">
                    El código introducido no es correcto. Inténtalo de nuevo.
                </div>
                <form (ngSubmit)="verifyUser()" method="post" class="h-auto mt-5">
                    <div class="d-flex justify-content-center gap-2 mb-4">
                        <input type="text" maxlength="1" class="form-control text-center inputSize" [(ngModel)]="code1"
                            name="code1" required autocomplete="off" #input1 inputmode="numeric" pattern="[0-9]*"
                            (input)="autoFocusNext($event, input2)" (keydown)="autoFocusPrev($event, null)"
                            (paste)="onPaste($event)">
                        <input type="text" maxlength="1" class="form-control text-center inputSize" [(ngModel)]="code2"
                            name="code2" required autocomplete="off" #input2 inputmode="numeric" pattern="[0-9]*"
                            (input)="autoFocusNext($event, input3)" (keydown)="autoFocusPrev($event, input1)">
                        <input type="text" maxlength="1" class="form-control text-center inputSize" [(ngModel)]="code3"
                            name="code3" required autocomplete="off" #input3 inputmode="numeric" pattern="[0-9]*"
                            (input)="autoFocusNext($event, input4)" (keydown)="autoFocusPrev($event, input2)">
                        <input type="text" maxlength="1" class="form-control text-center inputSize" [(ngModel)]="code4"
                            name="code4" required autocomplete="off" #input4 inputmode="numeric" pattern="[0-9]*"
                            (input)="autoFocusNext($event, input5)" (keydown)="autoFocusPrev($event, input3)">
                        <input type="text" maxlength="1" class="form-control text-center inputSize" [(ngModel)]="code5"
                            name="code5" required autocomplete="off" #input5 inputmode="numeric" pattern="[0-9]*"
                            (input)="autoFocusNext($event, input6)" (keydown)="autoFocusPrev($event, input4)">
                        <input type="text" maxlength="1" class="form-control text-center inputSize" [(ngModel)]="code6"
                            name="code6" required autocomplete="off" #input6 inputmode="numeric" pattern="[0-9]*"
                            (keydown)="autoFocusPrev($event, input5)">
                    </div>
                    <div class="text-center w-100 d-flex flex-column justify-content-center align-items-center">
                        <button class="btn btnForm mt-3" type="submit">Verificar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
