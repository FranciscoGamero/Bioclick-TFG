<div class="container py-5">
    <div class="row justify-content-center">
        <section class="col-md-8 col-lg-7">
            <div class="card shadow rounded-4 border-0">
                <div class="card-body p-4">
                    <div class="d-flex flex-column flex-md-row align-items-center mb-4">
                        <img [src]="limpiarUrlFoto(user!.fotoPerfilUrl)" alt="Avatar del usuario"
                            class="rounded-circle border border-4 border-success mb-3 mb-md-0 me-md-4 shadow"
                            style="width: 120px; height: 120px; object-fit: cover;">
                        <div class="text-center text-md-start">
                            <h1 class="h3 mb-1 fw-bold">{{user?.username}}</h1>
                            <p class="text-muted mb-2 fs-5">{{user?.correo}}</p>
                            <button class="btn btn-outline-success mt-2" type="button"
                                (click)="openEditDialog({ id: user!.id, username: user!.username, correo: user!.correo, fotoPerfilUrl: user!.fotoPerfilUrl, password: user!.password })">
                                <i class="bi bi-pencil me-1"></i> Editar perfil
                            </button>
                        </div>
                    </div>
                    <hr>
                    <div class="row g-4 mb-3">
                        <div class="col-md-6">
                            <label class="form-label mb-1 fw-semibold">Username</label>
                            <div class="form-control-plaintext ps-0 fs-5">{{user?.username}}</div>
                        </div>
                    </div>
                    <div class="row g-4 mb-3">
                        <div class="col-md-6">
                            <label class="form-label mb-1 fw-semibold">Correo Electrónico</label>
                            <div class="form-control-plaintext ps-0 fs-5">{{user?.correo}}</div>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <button class="btn" (click)="toggleFavorites()">
                        <h5 class="mb-3"><i class="bi bi-heart-fill text-danger me-2"></i>Mis Favoritos</h5>
                    </button>
                    <ul *ngIf="showFavorites" class="list-group list-group-flush">
                        <li *ngFor="let fav of favorites"
                            class="list-group-item d-flex align-items-center favorite-item" style="cursor:pointer;">
                            <i class="bi bi-star-fill text-warning me-2"></i>
                            <span class="fw-semibold flex-grow-1">{{ fav.nombreProducto }}</span>
                            <span class="text-muted small ms-2">
                                <i class="bi bi-calendar-event me-1"></i>{{ fav.fechaFavorito | date:'mediumDate' }}
                            </span>
                            <i class="bi bi-chevron-right ms-2 text-secondary"></i>
                        </li>
                    </ul>
                    <ng-template #noFavs>
                        <span class="text-muted">No tienes favoritos.</span>
                    </ng-template>
                </div>
            </div>
        </section>
    </div>
</div>
