<my-sidebar [isExpanded]="isExpanded" (toggleSidebar)="handleSidebarToggle()" />
<div class="content mt-5" [ngClass]="{ 'sidebarExpanded': isExpanded }" style="min-height: 60vh;">
    <div *ngIf="errorEditManager" class="alert alert-danger alert-dismissible fade show w-50" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Ha habido un problema al editar el manager.
    </div>
    <h2>Managers</h2>
    <div class="mb-5">
        <form (ngSubmit)="buscarPorNombre()" class="h-auto">
            <div class="d-flex align-items-center" style="max-width: 350px;">
                <div class="position-relative flex-grow-1 me-2">
                    <i class="bi bi-search position-absolute"
                        style="left: 18px; top: 50%; transform: translateY(-50%); color: #bfc9d8; font-size: 1.2rem;"></i>
                    <input type="text" class="form-control ps-5" placeholder="Username" [(ngModel)]="nombreManager"
                        id="nombreUser" name="nombreUser" />
                </div>
                <button class="btn btn-success" type="submit">Buscar</button>
                <button *ngIf="showBuscados" class="btn btn-secondary ms-3" type="button"
                    (click)="loadPannel()">Volver</button>
            </div>
        </form>
        <button class="btn btnForm mt-5" (click)="openCreateDialog()">Agregar Manager</button>
    </div>
    <div class="row bg-white pannel align-content-between mt-5 pt-5">
        <ng-container *ngIf="managersFound?.length; else noManagers">
            <div *ngFor="let user of managersFound" class="col-3 heightCol mb-4">
                <mat-card appearance="outlined" class="h-100 justify-content-center clickable-card">
                    <div class="d-flex">
                        <mat-card-header (click)="onCardClick(user.id)" class="imgCard">
                            <div mat-card-avatar>
                                <img mat-card-image class="imgSize" [src]="limpiarUrlFoto(user.fotoPerfilUrl)">
                            </div>
                        </mat-card-header>
                        <div class="d-flex flex-column justify-content-between w-100">
                            <p class="m-0 text-center text-white fw-semibold">{{ user.username }}</p>
                            <div class="d-flex w-100 justify-content-between">
                                <i class="bi bi-toggle2-on ps-3 mt-3 text-white"></i>
                                <div ngbDropdown class="d-inline-block text-end me-3">
                                    <button type="button" class="btn btn-outline-light" id="dropdownBasic1"
                                        ngbDropdownToggle>
                                        Ver opciones
                                    </button>
                                    <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
                                        <button ngbDropdownItem
                                            (click)="openEditDialog({ id: user.id, username: user.username, correo: user.correo, fotoPerfilUrl: limpiarUrlFoto(user.fotoPerfilUrl), password: user.password })">
                                            Editar</button>
                                        <button ngbDropdownItem
                                            (click)="openDeleteDialog({ id: user.id }); $event.stopPropagation()">
                                            Eliminar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </mat-card>
            </div>
        </ng-container>
        <ng-template #noManagers>
            <div class="d-flex justify-content-center align-items-center w-100" style="min-height: 300px;">
                <span class="text-center text-muted" style="font-size: 1.3rem;">
                    No hay managers para mostrar.
                </span>
            </div>
        </ng-template>
    </div>
    <ngb-pagination class="justify-content-center" [collectionSize]="managersFound.length" [(page)]="page"
        [pageSize]="12" [boundaryLinks]="true" (pageChange)="getManagers()" />
</div>
