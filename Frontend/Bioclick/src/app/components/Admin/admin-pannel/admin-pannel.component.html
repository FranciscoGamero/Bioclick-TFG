<my-sidebar [isExpanded]="isExpanded" (toggleSidebar)="handleSidebarToggle()" />
<div class="content mt-5" [ngClass]="{ 'sidebarExpanded': isExpanded }">
    <div *ngIf="showAlert" class="alert alert-danger mt-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ alertMessage }}
    </div>
    <h2>Administradores</h2>
    <div class="mb-5">
        <form (ngSubmit)="buscarPorNombre()" class="h-auto">
            <div class="d-flex align-items-center" style="max-width: 350px;">
                <div class="position-relative flex-grow-1 me-2">
                    <i class="bi bi-search position-absolute"
                        style="left: 18px; top: 50%; transform: translateY(-50%); color: #bfc9d8; font-size: 1.2rem;"></i>
                    <input type="text" class="form-control ps-5" placeholder="Username" [(ngModel)]="nombreAdmin"
                        id="nombreAdmin" name="nombreAdmin" />
                </div>
                <button class="btn btn-success" type="submit">Buscar</button>
                <button *ngIf="showBuscados" class="btn btn-secondary ms-3" type="button"
                    (click)="loadPannel()">Volver</button>
            </div>
        </form>
        <button class="btn btnForm mt-5" (click)="openCreateDialog()">Agregar Admin</button>

    </div>
    <div class="row bg-white pannel align-content-between mt-5 pt-5 mb-2">
        <div *ngFor="let user of (showBuscados ? (adminsPorNombre || []) : (adminsFound?.contenido || []))"
            class="col-3 heightCol mb-4">
            <mat-card appearance="outlined" class="h-100 justify-content-center clickable-card">
                <div class="d-flex">
                    <mat-card-header (click)="onCardClick(user.id)" class="imgCard">
                        <div mat-card-avatar>
                            <img mat-card-image class="imgSize" [src]="limpiarUrlFoto(user.fotoPerfilUrl)">
                        </div>
                    </mat-card-header>
                    <div class="d-flex flex-column justify-content-between w-100">
                        <p class="m-0 text-center text-white fw-semibold">{{ user.username }}</p>
                        <div class="d-flex w-100 justify-content-between">
                            <i class="bi bi-toggle2-on ps-3 mt-3 text-white"></i>
                        </div>
                    </div>
                </div>
            </mat-card>
        </div>
    </div>
    <ngb-pagination class="justify-content-center"
        [collectionSize]="(showBuscados ? adminsPorNombre.length : adminsFound?.contenido?.length || 0)" [page]="page"
        [boundaryLinks]="true" (pageChange)="(showBuscados ? buscarPorNombre() : getAdmins($event - 1))" />
</div>
