<app-header></app-header>
<div class="row">
  <div class="col-2">
    <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card mb-4">
        <div class="card-header fw-bold">Filtrar productos</div>
        <div class="card-body">
          <form (ngSubmit)="aplicarFiltros()">
            <div class="mb-3">
              <label for="categoria" class="form-label">Categoría</label>
              <select id="categoria" class="form-select" [(ngModel)]="filtroCategoria" name="categoria">
                <option value="">Todas</option>
                <option *ngFor="let cat of categorias" [value]="cat.nombreCategoria">{{formatCategoriaName(cat.nombreCategoria)}}</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Precio mínimo</label>
              <input type="number" class="form-control" [(ngModel)]="precioMin" name="precioMin" min="0">
            </div>
            <div class="mb-3">
              <label class="form-label">Precio máximo</label>
              <input type="number" class="form-control" [(ngModel)]="precioMax" name="precioMax" min="0">
            </div>
            <button class="btn btn-success w-100" type="submit">Aplicar filtros</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="col-10">
    <div class="container my-5 showBuscados">
      <form (ngSubmit)="buscarPorNombre()" class="h-auto w-25">
        <div class="h-50 w-auto d-flex flex-column mt-5 mb-5">
          <div class="d-flex align-items-center search-form-wrapper">
            <div class="position-relative flex-grow-1 me-2">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="form-control inputRadius ps-5" placeholder="Nombre del Producto"
                [(ngModel)]="nombreProducto" id="nombreProducto" name="nombreProducto" />
            </div>
            <button class="btn btn-success me-2" type="submit">Buscar</button>
            <button *ngIf="showBuscados" class="btn btn-secondary" type="button" (click)="loadHome()">Volver</button>
          </div>
        </div>
      </form>
      <div class="row g-4 justify-content-center">
        <div class="col-12 col-sm-6 col-md-4 col-lg-4" *ngFor="let producto of allProducts">
          <div class="card product-card shadow-sm">
            <div class="img-thumbnail mb-3" (click)="goToProductDetail(producto.id)">
              <img [src]="limpiarUrlFoto(producto.imagenProducto)" class="card-img-top"
                alt="{{ producto.nombreProducto }}" style="height: 200px; object-fit: cover;">
            </div>
            <div class="card-body text-center">
              <h5 class="card-title">{{ producto.nombreProducto }}</h5>
              <p class="card-text">{{ producto.descripcion }}</p>
              <button class="btn btn-outline-success btn-sm" [ngClass]="{'active': isFavorite(producto)}"
                (click)="toggleFavorite(producto)">
                <i class="bi" [ngClass]="isFavorite(producto) ? 'bi-heart-fill' : 'bi-heart'"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="text-center mt-4" *ngIf="page < totalPages">
        <button class="btn btn-success px-5" (click)="loadAllProducts()">VER MÁS</button>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
