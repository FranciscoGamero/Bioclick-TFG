<app-header></app-header>
<div class="container my-5 product-detail-container">
    <button class="btn btn-outline-secondary mb-3 backButton" (click)="goBack()">
        <i class="bi bi-arrow-left"></i> Volver
    </button>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-4">
                <img [src]="limpiarUrlFoto(product?.imagenProducto)" alt="{{product?.nombreProducto}}"
                    class="img-fluid product-img-main rounded">
            </div>
            <!-- Nombre y precio del producto -->
            <div class="d-flex align-items-center justify-content-between mb-2">
                <h3 class="fw-bold mb-0">{{ product?.nombreProducto }}</h3>
                <div class="fs-2 fw-bold text-success">{{ product?.precioProducto }}€</div>
            </div>
            <!-- Botón de favorito justo debajo o a la derecha -->
            <div class="mb-3 text-end">
                <button class="btn btn-outline-success" (click)="toggleFavorite()">
                    <i class="bi" [ngClass]="isFavorite ? 'bi-heart-fill text-danger' : 'bi-heart'"></i>
                    {{ isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos' }}
                </button>
            </div>
            <div class="fs-2 fw-bold text-success mb-2">{{product?.precioProducto}}€</div>
            <div class="mb-3">
                <span class="fw-semibold">Estado:</span> <span class="text-success">{{product?.estado}}</span>
            </div>
            <div class="mb-4">
                <div class="fw-semibold mb-2">Reviews</div>
                <div class="d-flex align-items-center mb-2">
                    <span class="fs-3 fw-bold me-2">{{ getAverageValoration() }}</span>
                    <div>
                        <ngb-rating [rate]="getAverageValoration()" [readonly]="true" [max]="5" [starTemplate]="t">
                        </ngb-rating>
                        <ng-template #t let-fill="fill">
                            <i class="bi" [ngClass]="[fill === 100 ? 'bi-star-fill' :
                            (fill > 0 ? 'bi-star-half' : 'bi-star'), getRatingColorClass()]">
                            </i>
                        </ng-template>
                        <span class="text-muted ms-2">{{valorations.length}}</span>
                        <div class="d-flex align-items-center gap-3 review-actions">
                            <button *ngIf="!myValoration" class="btn btn-outline-primary btn-sm"
                                (click)="openValorationForm()">
                                <i class="bi bi-plus-circle me-1"></i>Añadir valoración
                            </button>
                            <button *ngIf="myValoration" class="btn btn-outline-danger"
                                (click)="deleteValoration(myValoration.valoracionId, product!.id)">
                                Quitar valoración
                            </button>
                            <div *ngIf="showValorationForm" class="valoration-form d-flex align-items-center gap-2">
                                <ngb-rating [(rate)]="userRating" [readonly]="false" [max]="5"></ngb-rating>
                                <button class="btn btn-success btn-sm"
                                    (click)="submitValoration(userRating, product!.id)" [disabled]="userRating === 0">
                                    <i class="bi bi-check-circle me-1"></i>Enviar valoración
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" (click)="showValorationForm = false">
                                    <i class="bi bi-x-circle me-1"></i>Cancelar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="reviews-list">
                    <div class="add-comment-box mb-4 p-3 rounded shadow-sm bg-light">
                        <label for="newComment" class="form-label fw-semibold mb-2">
                            <i class="bi bi-chat-left-text me-1"></i> Añadir un comentario
                        </label>
                        <div class="d-flex align-items-center gap-2">
                            <input id="newComment" type="text" class="form-control" [(ngModel)]="newComment"
                                placeholder="Escribe tu comentario..." maxlength="250" />
                            <button class="btn btn-success" [disabled]="!newComment || newComment.trim().length === 0"
                                (click)="addComment(newComment); newComment='';">
                                <i class="bi bi-send"></i>
                            </button>
                        </div>
                        <div class="review-item mb-4" *ngFor="let comentarioUsuario of listaComentarios">
                            <div class="d-flex align-items-center mb-1">
                                <img [src]="limpiarUrlFoto(comentarioUsuario.fotoPerfil)"
                                    alt="{{comentarioUsuario.username}}" class="rounded-circle me-2 review-avatar">
                                <div>
                                    <span class="fw-semibold">{{comentarioUsuario.username}}</span>
                                    <span
                                        class="text-muted small ms-2">{{formatDate(comentarioUsuario.fechaComentario)}}</span>
                                </div>
                                <button *ngIf="comentarioUsuario.usuarioId === currentUserId"
                                    class="btn btn-sm btn-link ms-2" (click)="startEditComment(comentarioUsuario)">
                                    <i class="bi bi-pencil"></i> Editar
                                </button>
                                <button *ngIf="canDeleteComment(comentarioUsuario)"
                                    class="btn btn-sm btn-link text-danger ms-1"
                                    (click)="deleteComment(comentarioUsuario.id)">
                                    <i class="bi bi-trash"></i> Borrar
                                </button>
                            </div>
                            <div *ngIf="editingCommentId === comentarioUsuario.id; else showComment">
                                <input type="text" class="form-control d-inline w-auto" [(ngModel)]="editedComment"
                                    maxlength="250" />
                                <button class="btn btn-success btn-sm ms-2"
                                    (click)="saveEditComment(comentarioUsuario.id)">
                                    <i class="bi bi-check"></i>
                                </button>
                                <button class="btn btn-outline-secondary btn-sm ms-1" (click)="cancelEditComment()">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                            <ng-template #showComment>
                                <div class="review-text">{{ comentarioUsuario.comentario }}</div>
                            </ng-template>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <app-footer></app-footer>
